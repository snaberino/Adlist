name: Merge blocklists

on:
  schedule:
    - cron: "17 2 * * *"   # ogni giorno 02:17 Europe/Rome circa
  workflow_dispatch: {}     # avvio manuale

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run merger
        run: |
          python3 merge_blocklists.py

      - name: Commit & push outputs (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/merged.domains output/merged.hosts || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update merged lists [skip ci]"
            git push
          else
            echo "Nessuna modifica: skip commit"
          fi
